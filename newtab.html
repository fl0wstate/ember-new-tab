<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>New Tab</title>
  <link rel="stylesheet" href="background.css?v=0.5.3">
  <!-- The field first: it answers keys before the shader is built. -->
  <script src="search.js?v=0.5.3" defer></script>
  <script src="background.js?v=0.5.3" defer></script>
  <script src="wallpaper.js?v=0.5.3" defer></script>
</head>
<body>
  <canvas id="background" aria-hidden="true"></canvas>
  <img id="custom-background" alt="" aria-hidden="true" hidden>
  <form id="search" role="search" autocomplete="off">
    <span id="site-chip" hidden></span>
    <input id="query" name="q" type="text" aria-label="Search or enter address"
      placeholder="Enter a web address" autocomplete="off" autocapitalize="off" autocorrect="off"
      spellcheck="false" enterkeyhint="go" role="combobox" aria-autocomplete="both"
      aria-expanded="false" aria-controls="suggestions" autofocus>
    <ul id="suggestions" role="listbox" aria-label="Suggestions" hidden></ul>
  </form>
  <button id="background-options" type="button" popovertarget="background-menu"
    aria-label="Choose background" title="Choose background">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="4"/>
      <circle cx="8" cy="8" r="1.5"/>
      <path d="m3 17 5-5 4 4 4-6 5 7"/>
    </svg>
  </button>
  <div id="background-menu" popover aria-label="Background options">
    <button id="upload-background" type="button">Upload shader image…</button>
    <button id="reset-background" type="button">Reset to orange shader</button>
  </div>
  <input id="background-file" type="file" accept="image/*" hidden>
  <p id="background-status" role="status" hidden></p>
</body>
</html>
